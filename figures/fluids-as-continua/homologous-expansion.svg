<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="homologous-t homologous-d">
<title id="homologous-t">Homologous expansion of a sphere of gas</title>
<desc id="homologous-d">Three snapshots of an expanding sphere of gas, at time zero and at two later times. The sphere grows and its shading becomes lighter as the density decreases. Six marked fluid elements at half the radius and six at the surface move outward along straight radial lines. Each element carries a velocity arrow whose length does not change from one snapshot to the next, because the elements coast; the arrows of the outer elements are twice as long as those of the inner ones. The pattern of elements is the same in every snapshot, only scaled up.</desc>
