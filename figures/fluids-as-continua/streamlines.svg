<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="img" aria-labelledby="title desc">
  <title id="title">Streamlines crossing a closed surface</title>
  <desc id="desc">Left: four curved streamlines enter from the lower left and leave towards the upper right,
  each crossing a closed curve twice, once entering and once leaving, so there are no sources or sinks inside. Right:
  eight straight streamlines radiate outward from the centre of a circle, so each crosses the circle once and the
  centre is a source.</desc>
  <!-- Redrawn from the 2025 TeXmacs figure (01-fluid-as-continua). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M 8 172 C 90 150 150 100 175 18"/>
    <path d="M 8 235 C 110 215 190 150 210 20"/>
    <path d="M 148 275 C 155 190 205 120 275 68"/>
    <path d="M 212 292 C 215 220 250 150 305 95"/>
  </g>
  <path d="M 50 118 C 55 100 90 105 140 118 C 190 130 235 160 245 185 C 250 205 215 218 160 224
           C 110 230 90 220 75 200 C 60 180 48 140 50 118 Z" fill="none" stroke="#000" stroke-width="3.2"/>
  <g fill="none" stroke="#000" stroke-width="1.6">
    <circle cx="505" cy="165" r="85" stroke-width="3.2"/>
    <g marker-end="url(#arrow)">
      <path d="M 505 165 V 10"/><path d="M 505 165 V 292"/>
      <path d="M 505 165 H 360"/><path d="M 505 165 H 632"/>
      <path d="M 505 165 L 395 55"/><path d="M 505 165 L 615 55"/>
      <path d="M 505 165 L 395 275"/><path d="M 505 165 L 615 275"/>
    </g>
  </g>
</svg>
