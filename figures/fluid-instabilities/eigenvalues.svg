<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="eigen-t eigen-d">
<title id="eigen-t">Sketch of the eigenfrequencies in the complex plane</title>
<desc id="eigen-d">Two panels, each with the real part of omega on the horizontal axis and the imaginary part on the vertical axis. Left panel: six crosses below the horizontal axis (stable modes), each with an arrow pointing upwards; as the Reynolds number increases, they cross the axis into the upper half plane (unstable modes). Right panel: dots for the modes of a shear layer with different wave numbers. Starting from the origin, the dots rise along a straight line, reach a maximum, and then bend down, crossing the axis: modes with large wave numbers are damped by viscosity. Arrows show the dots moving upwards as the Reynolds number increases.</desc>
