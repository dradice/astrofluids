<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="sheet-t sheet-d">
<title id="sheet-t">Perturbed vortex sheet</title>
<desc id="sheet-d">A horizontal sinusoidal curve separates two regions. Above it the fluid moves to the right with velocity V_2, below it with velocity V_1. A vertical arrow from the unperturbed position of the sheet to the crest of the curve is labelled xi, the displacement. Axes in the corner: x points up and y to the right.</desc>
