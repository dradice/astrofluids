<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="eulerlagrange-t eulerlagrange-d">
<title id="eulerlagrange-t">Eulerian and Lagrangian descriptions of a flow</title>
<desc id="eulerlagrange-d">Two panels with the same curved streamlines, flowing from left to right. Left panel, Eulerian: an observer sits at a fixed point, marked by a cross in a circle, on the middle streamline. Three different fluid elements, labelled 1, 2 and 3, are on their way through that point: element 1 has just passed it and element 3 is still upstream. The observer measures the partial derivative with respect to time. Right panel, Lagrangian: a single fluid element is shown at three successive times, t_1, t_2 and t_3, as it moves along its trajectory. An observer riding with it measures the advective derivative d/dt.</desc>
