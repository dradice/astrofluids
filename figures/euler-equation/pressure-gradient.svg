<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="t d" font-family="'STIX Two Text','Times New Roman',serif" font-size="20">
  <title id="t">Forces on a fluid element at rest</title>
  <desc id="d">A square fluid element V with a pressure force of magnitude p dA pushing inward on each of its four drawn faces, and a gravity force rho g pointing down from its center. The x axis points right and the z axis points down.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="440" height="300" fill="#fff"/>
  <rect x="154" y="8" width="280" height="282" fill="none" stroke="#000" stroke-width="2.5"/>
  <g stroke="#000" stroke-width="1.8" fill="none" marker-end="url(#ah)">
    <line x1="15" y1="147" x2="127" y2="147"/>
    <line x1="15" y1="147" x2="15" y2="258"/>
    <line x1="291" y1="12" x2="291" y2="52"/>
    <line x1="154" y1="147" x2="188" y2="147"/>
    <line x1="430" y1="147" x2="396" y2="147"/>
    <line x1="291" y1="286" x2="291" y2="218"/>
  </g>
  <circle cx="291" cy="147" r="4.5" fill="#000"/>
  <line x1="291" y1="147" x2="291" y2="188" stroke="#000" stroke-width="1.8" marker-end="url(#ah)"/>
  <g fill="#000">
    <text x="97" y="128" font-style="italic">x</text>
    <text x="32" y="232" font-style="italic">z</text>
    <text x="302" y="48">−<tspan font-style="italic">p</tspan> d<tspan font-weight="bold">A</tspan></text>
    <text x="170" y="122">−<tspan font-style="italic">p</tspan> d<tspan font-weight="bold">A</tspan></text>
    <text x="320" y="122">−<tspan font-style="italic">p</tspan> d<tspan font-weight="bold">A</tspan></text>
    <text x="302" y="178"><tspan font-style="italic">ρ</tspan> <tspan font-weight="bold">g</tspan></text>
    <text x="302" y="262">−<tspan font-style="italic">p</tspan> d<tspan font-weight="bold">A</tspan></text>
    <text x="190" y="256" font-style="italic">V</text>
  </g>
</svg>
