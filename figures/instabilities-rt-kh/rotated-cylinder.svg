<path d="M 151.7 262.5 A 125 125 0 0 0 368.3 137.5 L 342.3 152.5 A 95 95 0 0 1 177.7 247.5 Z" fill="#ececec" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
