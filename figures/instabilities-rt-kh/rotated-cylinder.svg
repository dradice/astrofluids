<line x1="20.0" y1="200.0" x2="135.0" y2="200.0" stroke="#000" stroke-width="1.6"/>
<line x1="385.0" y1="200.0" x2="500.0" y2="200.0" stroke="#000" stroke-width="1.6"/>
<line x1="165.0" y1="200.0" x2="355.0" y2="200.0" stroke="#000" stroke-width="1.6"/>
<line x1="260.0" y1="200.0" x2="368.3" y2="137.5" stroke="#000" stroke-width="2.2"/>
