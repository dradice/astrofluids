<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="rtring-t rtring-d">
<title id="rtring-t">Fluid cylinder rotated across a heavy-over-light interface</title>
<desc id="rtring-d">A heavy fluid of density rho_2 lies on top of a lighter fluid of density rho_1 along a horizontal interface. A circular region of radius r is split by the interface into a heavy upper half and a light lower half. Around it, a thin ring of fluid has been rotated counterclockwise by an angle theta: heavy fluid has moved down on the left and light fluid has moved up on the right.</desc>
<defs><marker id="ah-k" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="520" height="400" fill="#fff"/>
<g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif">
