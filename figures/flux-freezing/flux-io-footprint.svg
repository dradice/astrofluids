<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="foot-t foot-d">
<title id="foot-t">Footprint and cross-section of the Io flux tube</title>
<desc id="foot-d">Left: the footprint of the flux tube on Jupiter's atmosphere is an ellipse with semi-axes X along x and Y along y, surrounded by a thin shaded boundary layer of width 2 epsilon. Blue field lines pass over and under it. Right: Jupiter, of radius R_J, rotating about a vertical axis, and Io at distance a. The flux tube leaves the planet at colatitude theta_i and loops out to Io; arrows labelled I show the current flowing along the tube.</desc>
