<title id="resist-t">Resistive smoothing of a magnetic field line</title>
<desc id="resist-d">Three snapshots of one field line B that points upwards. At first it is bent and has small-scale wiggles; later the wiggles are gone and only the large-scale bend remains; finally the line is straight. Arrows labelled t between the snapshots show the passage of time.</desc>
