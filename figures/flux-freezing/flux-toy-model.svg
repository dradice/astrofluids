<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 375" width="700" height="375" role="img" aria-labelledby="toy-t toy-d">
<title id="toy-t">Toy model of the Io-Jupiter interaction</title>
<desc id="toy-d">Two thick horizontal walls at y = plus and minus D, between which a conductor of half-width d (the region between the two blue lines) moves to the right with velocity v. A magnetic field line B0 comes in from above, anchored in the walls, and is dragged by the conductor into a bent shape extending a distance L in the x direction. A current j points out of the page inside the conductor.</desc>
