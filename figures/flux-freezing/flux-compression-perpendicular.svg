<text x="60" y="106" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">A<tspan dy="5.0" font-size="14.4" font-style="normal">1</tspan></text>
<line x1="420.0" y1="8.0" x2="420.0" y2="32.0" stroke="#000" stroke-width="2" marker-end="url(#ah-k)"/>
