<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="io-t io-d">
<title id="io-t">Magnetic flux tube connecting Io and Jupiter</title>
<desc id="io-d">View of Jupiter (circle) and the circular orbit of Io, seen from above the rotation axis. A thick blue flux tube joins Io to its foot on Jupiter, which is displaced by a longitude difference delta-phi (dashed lines) from the direction to Earth. Radio emission from the foot is beamed in a cone, drawn as two rays at an angle mu on either side of the direction perpendicular to the field; a downward arrow marks the direction to Earth.</desc>
