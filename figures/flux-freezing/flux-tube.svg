<title id="tube-t">Deformation of a magnetic flux tube</title>
<desc id="tube-d">A flux tube with a magnetic field line along its axis is carried by the flow from a gently bent shape to a more strongly bent and narrower shape; the field line stays inside the tube.</desc>
