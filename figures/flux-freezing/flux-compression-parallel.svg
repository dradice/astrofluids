<ellipse cx="530.0" cy="80.0" rx="21.0" ry="42.0" transform="rotate(0.0 530.0 80.0)" fill="#fff" stroke="#000" stroke-width="1.6"/>
<line x1="150.0" y1="80.0" x2="460.0" y2="80.0" stroke="#1f4fbf" stroke-width="2.4" marker-end="url(#ah-1f4fbf)"/>
<text x="474" y="88" text-anchor="start" font-size="24" font-style="normal" font-weight="bold" fill="#1f4fbf">B</text>
<text x="152" y="115" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">A</text>
<text x="340.0" y="165" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">ℓ</text>
<line x1="25.0" y1="80.0" x2="100.0" y2="80.0" stroke="#000" stroke-width="2" marker-end="url(#ah-k)"/>
