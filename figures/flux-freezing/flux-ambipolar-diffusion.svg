<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 670" width="560" height="670" role="img" aria-labelledby="ambi-t ambi-d">
<title id="ambi-t">Ambipolar diffusion</title>
<desc id="ambi-d">A roughly circular region of neutral gas, drawn as a wavy circle, contains a few ions (dots). Two magnetic field lines labelled B enter from the bottom and leave at the top; they pass through the ion region, bowing inwards, and are tied to the ions, while the neutrals can move across them.</desc>
