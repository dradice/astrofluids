<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290"
     role="img" aria-labelledby="title desc">
  <title id="title">Lagrangian displacement of a fluid element</title>
  <desc id="desc">A fluid element at position x, where a quantity has the value q, is
  displaced by the vector xi to position x plus xi, where the quantity has the value
  q plus delta q. The Eulerian perturbation is q prime of x equals delta q minus xi
  dot the gradient of q.</desc>
  <!-- Redrawn from the 2025 TeXmacs figure (08-sound-waves). Drawn at the size at
       which labels match the body text (about 19 px). Edit by hand or in Inkscape. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="440" height="290" fill="#fff"/>
  <g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif" font-size="20"
     fill="#000" stroke="none">
    <!-- displaced element -->
    <rect x="215" y="12" width="100" height="90" fill="none" stroke="#000" stroke-width="2.2"/>
    <text x="265" y="64" text-anchor="middle"><tspan font-weight="bold">x</tspan> + <tspan
      font-weight="bold" font-style="italic">ξ</tspan></text>
    <text x="328" y="98"><tspan font-style="italic">q</tspan> + δ<tspan font-style="italic">q</tspan></text>

    <!-- displacement -->
    <path d="M 55 188 C 75 125, 130 80, 205 60" fill="none" stroke="#000" stroke-width="2.2"
          marker-end="url(#arrow)"/>
    <text x="140" y="150" font-weight="bold" font-style="italic">ξ</text>

    <!-- original element -->
    <rect x="12" y="195" width="100" height="85" fill="none" stroke="#000" stroke-width="2.2"/>
    <text x="62" y="243" text-anchor="middle" font-weight="bold">x</text>
    <text x="124" y="276" font-style="italic">q</text>

    <!-- Eulerian perturbation -->
    <text x="165" y="214"><tspan font-style="italic">q</tspan>′(<tspan font-weight="bold">x</tspan>) =
      δ<tspan font-style="italic">q</tspan> − <tspan font-weight="bold" font-style="italic">ξ</tspan> · ∇<tspan
      font-style="italic">q</tspan></text>
  </g>
</svg>
