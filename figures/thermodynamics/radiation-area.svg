<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330"
     role="img" aria-labelledby="title desc">
  <title id="title">Area element for the radiation pressure calculation</title>
  <desc id="desc">A shaded parallelogram representing the area element dA, seen obliquely. From its centre the unit normal
  n-hat points up and slightly left. A second arrow, the photon direction Omega-hat, points up and to the right at an
  angle theta from the normal, with a small circle at its tip representing the solid angle d Omega.</desc>
  <!-- Redrawn from the 2025 TeXmacs figure (02-thermodynamics). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fff"/>
  <path d="M 20 195 L 215 75 L 410 195 L 215 315 Z" fill="#dcdcdc" stroke="#000" stroke-width="1.6"/>
  <g fill="none" stroke="#000" stroke-width="1.6">
    <path d="M 215 195 L 232 82" stroke-width="2.6" marker-end="url(#arrow)"/>
    <path d="M 215 195 L 292 82" marker-end="url(#arrow)"/>
    <path d="M 215 195 L 280 62"/>
    <path d="M 215 195 L 313 83"/>
    <circle cx="298" cy="72" r="22"/>
    <path d="M 224 143 A 55 55 0 0 1 247 146"/>
  </g>
  <g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif" font-size="20" fill="#000">
    <text x="204" y="70" font-weight="bold">n̂</text>
    <text x="287" y="30" font-weight="bold">Ω</text><text x="289" y="20" font-weight="bold" font-size="18">^</text>
    <text x="244" y="134" font-style="italic">θ</text>
    <text x="330" y="88">dΩ</text>
    <text x="200" y="268">d<tspan font-style="italic">A</tspan></text>
  </g>
</svg>
