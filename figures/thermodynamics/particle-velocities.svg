<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420"
     role="img" aria-labelledby="title desc">
  <title id="title">Decomposition of the velocity of particles in a fluid element</title>
  <desc id="desc">A cube representing a fluid element, containing a scattering of dots for the particles. One particle
  has an arrow labelled v plus w, the sum of the bulk velocity and the peculiar velocity. A separate arrow labelled x-hat
  points to the right, normal to the shaded right face of the cube, which is labelled dA.</desc>
  <!-- Redrawn from the 2025 TeXmacs figure (02-thermodynamics). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fff"/>
  <!-- shaded right face -->
  <path d="M 310 120 L 380 50 V 280 L 310 350 Z" fill="#c8c8c8" stroke="none"/>
  <g fill="none" stroke="#000" stroke-width="1.6">
    <path d="M 20 120 H 310 V 350 H 20 Z"/>
    <path d="M 20 120 L 90 50 H 380 L 310 120"/>
    <path d="M 380 50 V 280 L 310 350"/>
    <path d="M 20 350 L 90 280 H 380" stroke-dasharray="8 6"/>
    <path d="M 90 50 V 280" stroke-dasharray="8 6"/>
    <path d="M 332 200 H 460" marker-end="url(#arrow)"/>
    <path d="M 128 232 L 168 182" marker-end="url(#arrow)"/>
  </g>
  <g fill="#000">
    <circle cx="125" cy="237" r="3.5"/>
    <circle cx="60" cy="210" r="3.5"/><circle cx="95" cy="236" r="3.5"/><circle cx="82" cy="170" r="3.5"/>
    <circle cx="118" cy="150" r="3.5"/><circle cx="150" cy="205" r="3.5"/><circle cx="190" cy="250" r="3.5"/>
    <circle cx="214" cy="212" r="3.5"/><circle cx="240" cy="270" r="3.5"/><circle cx="270" cy="235" r="3.5"/>
    <circle cx="180" cy="300" r="3.5"/><circle cx="130" cy="310" r="3.5"/><circle cx="235" cy="170" r="3.5"/>
    <circle cx="275" cy="190" r="3.5"/><circle cx="160" cy="130" r="3.5"/><circle cx="215" cy="100" r="3.5"/>
    <circle cx="275" cy="100" r="3.5"/><circle cx="355" cy="150" r="3.5"/><circle cx="350" cy="205" r="3.5"/>
    <circle cx="335" cy="250" r="3.5"/><circle cx="360" cy="300" r="3.5"/><circle cx="45" cy="300" r="3.5"/>
  </g>
  <g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif" font-size="20" fill="#000">
    <text x="110" y="172" font-weight="bold" transform="translate(30 5)"><tspan>v</tspan><tspan font-weight="normal"> + </tspan><tspan>w</tspan></text>
    <text x="458" y="182" font-weight="bold">x̂</text>
    <text x="338" y="372">d<tspan font-style="italic">A</tspan></text>
  </g>
</svg>
