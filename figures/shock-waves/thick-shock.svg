<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-labelledby="thick-shock-t thick-shock-d">
<title id="thick-shock-t">Structure of a radiatively thick shock</title>
<desc id="thick-shock-d">A tube with the gas flowing from left to right. In the middle, a double blue line is the viscous shock. Wavy arrows labelled gamma show photons moving from the viscous shock upstream, to the left, into the precursor, which is bounded by a red line on the left. Downstream of the viscous shock, a relaxation layer ends at a second red line. Upstream of the precursor the gas has rho_1, u_1 and h_1; downstream of the relaxation layer it has rho_2, u_2 and h_2.</desc>
