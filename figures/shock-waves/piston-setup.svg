<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-labelledby="piston-t piston-d">
<title id="piston-t">A piston driving a shock into a cold gas</title>
<desc id="piston-d">A tube with a piston on the left, shown as a grey block with a handle. The piston moves to the right at speed v_p. A vertical blue line to the right of the piston is the shock, moving right at speed s. Between piston and shock the gas has density rho_2, velocity v_p and pressure p_2. Ahead of the shock the gas is at rest with density rho_1 and zero pressure.</desc>
<defs><marker id="ah-k" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ah-1f4fbf" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#1f4fbf" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="480" height="170" fill="#fff"/>
<g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif">
<line x1="20.0" y1="25.0" x2="460.0" y2="25.0" stroke="#000" stroke-width="1.6"/>
<line x1="20.0" y1="145.0" x2="460.0" y2="145.0" stroke="#000" stroke-width="1.6"/>
<rect x="105" y="25" width="14" height="120" fill="#d9d9d9" stroke="#d9d9d9" stroke-width="0"/>
<rect x="20" y="76" width="85" height="18" fill="#d9d9d9" stroke="#d9d9d9" stroke-width="0"/>
<line x1="250.0" y1="25.0" x2="250.0" y2="145.0" stroke="#1f4fbf" stroke-width="2.2"/>
<line x1="254.0" y1="88.0" x2="292.0" y2="88.0" stroke="#1f4fbf" stroke-width="1.6" marker-end="url(#ah-1f4fbf)"/>
<text x="272" y="112" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#1f4fbf">s</text>
<text x="185" y="55" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">ρ<tspan dy="5.0" font-size="14.4" font-style="normal">2</tspan></text>
<text x="380" y="55" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">ρ<tspan dy="5.0" font-size="14.4" font-style="normal">1</tspan></text>
<text x="185" y="90" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">v<tspan dy="5.0" font-size="14.4" font-style="normal">p</tspan></text>
<text x="380" y="90" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">v<tspan dy="5.0" font-size="14.4" font-style="normal">1</tspan><tspan dy="-5"> = 0</tspan></text>
<text x="185" y="125" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">p<tspan dy="5.0" font-size="14.4" font-style="normal">2</tspan></text>
<text x="380" y="125" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">p<tspan dy="5.0" font-size="14.4" font-style="normal">1</tspan><tspan dy="-5"> = 0</tspan></text>
