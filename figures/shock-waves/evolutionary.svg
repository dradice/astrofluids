<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="740" height="230" role="img" aria-labelledby="evolutionary-t evolutionary-d">
<title id="evolutionary-t">Small perturbations of a shock</title>
<desc id="evolutionary-d">A shock in its rest frame, with the gas flowing from left to right. A thin dashed vertical line marks the unperturbed shock; the perturbed shock, a thick wavy line, oscillates around it, and its displacement is marked eta. On the upstream side, on the left, two gray arrows point towards the shock: the sound waves moving at u_1 - c_s,1 and u_1 + c_s,1, which are both positive. On the downstream side, on the right, a gray arrow points towards the shock: the sound wave moving at u_2 - c_s,2, which is negative. Two blue arrows point away from the shock: the entropy and vorticity perturbations, moving at u_2, and the sound wave moving at u_2 + c_s,2.</desc>
