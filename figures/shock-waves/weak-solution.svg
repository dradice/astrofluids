<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img" aria-labelledby="weak-solution-t weak-solution-d">
<title id="weak-solution-t">A discontinuity in the x-t plane</title>
<desc id="weak-solution-d">Axes t, vertical, and x, horizontal. A thick line starts at the origin and reaches x = sT at time T: it is the discontinuity, moving with speed s. To its left the solution is U_L, to its right U_R. A horizontal line at t = T and a dashed vertical line at x = X bound the integration region.</desc>
<defs><marker id="ah-k" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="460" height="300" fill="#fff"/>
<g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif">
<line x1="60.0" y1="255.0" x2="60.0" y2="25.0" stroke="#000" stroke-width="1.6" marker-end="url(#ah-k)"/>
<line x1="60.0" y1="255.0" x2="440.0" y2="255.0" stroke="#000" stroke-width="1.6" marker-end="url(#ah-k)"/>
<text x="48" y="30" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">t</text>
<text x="430" y="283" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">x</text>
<text x="50" y="277" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">0</text>
<line x1="60.0" y1="65.0" x2="430.0" y2="65.0" stroke="#000" stroke-width="1.6"/>
<text x="50" y="72" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">T</text>
<line x1="60.0" y1="255.0" x2="225.0" y2="65.0" stroke="#000" stroke-width="3.4"/>
<text x="225.0" y="55" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">sT</text>
<line x1="360.0" y1="255.0" x2="360.0" y2="65.0" stroke="#000" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="360" y="283" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">X</text>
<text x="100" y="135" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">U<tspan dy="5.0" font-size="14.4" font-style="normal">L</tspan></text>
<text x="275" y="175" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">U<tspan dy="5.0" font-size="14.4" font-style="normal">R</tspan></text>
<text x="162.0" y="208.0" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">s</text>
</g>
</svg>
