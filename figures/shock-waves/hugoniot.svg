<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="hugoniot-t hugoniot-d">
<title id="hugoniot-t">Shock adiabat and adiabats</title>
<desc id="hugoniot-d">Logarithmic plot of the pressure ratio p_2/p_1 against the volume ratio V_2/V_1 for Gamma = 5/3. The adiabats p V^Gamma = const are straight blue lines. The shock adiabat, in black, touches the adiabat through the point (1, 1) at that point. For compressions, V_2/V_1 &lt; 1, it rises above it towards a vertical asymptote at V_2/V_1 = (Gamma - 1)/(Gamma + 1) = 1/4, and a compressed state lies on a higher adiabat, so its entropy is larger. For expansions, V_2/V_1 &gt; 1, the shock adiabat is dashed and lies below the adiabat through (1, 1), so the entropy would be smaller.</desc>
