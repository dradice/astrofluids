<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="title desc">
<title id="title">The Richardson cascade</title>
<desc id="desc">Rows of eddies of decreasing size: a few large eddies of size l0 at the top, then more eddies of size r l0, r squared l0, r cubed l0, down to the dissipation scale eta, drawn as a dotted line. Arrows on the right show energy injected at the rate epsilon at the top, a constant flux of energy epsilon from large to small scales, and dissipation of energy at the rate epsilon at the bottom.</desc>
