<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500">
<title>Distortion of a cloud in a turbulent medium</title>
<desc>Three rows. In case A the cloud radius is comparable to the dissipation scale and small random flows act inside the cloud, which ends as a slightly deformed blob. In case B the cloud is much larger than the dissipation scale but much smaller than the driving scale, eddies stretch it into a strongly distorted shape. In case C the cloud is comparable to the driving scale and a single large-scale flow carries it along without deforming it.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0b3d91" stroke-width="1.6"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.8"/></marker>
</defs>
