<title id="uniform-sphere-t">Gravitational potential of a uniform sphere</title>
<desc id="uniform-sphere-d">The potential Psi as a function of r. It starts at minus 3 G M over 2 R at the center, grows like r squared inside the sphere, reaches minus G M over R at r = R, and then approaches zero like minus one over r outside.</desc>
