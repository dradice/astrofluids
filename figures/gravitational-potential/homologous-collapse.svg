<title id="homologous-t">Effective potential and evolution of a collapsing homogeneous sphere</title>
<desc id="homologous-d">Left: the effective potential U_eff(a), proportional to minus one over a, below the horizontal a axis, with a horizontal line at the energy E below zero and an arrow showing the point moving towards smaller a. Right: the scale factor a decreases to zero in a finite time, while the density rho grows without bound.</desc>
