<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-labelledby="nozzle-t nozzle-d">
<title id="nozzle-t">A de Laval nozzle</title>
<desc id="nozzle-d">A pipe whose cross-sectional area A(s) decreases to a minimum, the throat, and then increases again. The gas flows from left to right. It is subsonic, Ma &lt; 1, before the throat, it reaches Ma = 1 at the throat, and it is supersonic, Ma &gt; 1, after it.</desc>
