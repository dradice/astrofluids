<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="pcygni-t pcygni-d">
<title id="pcygni-t">Sketch of a P Cygni line profile</title>
<desc id="pcygni-d">Flux, in units of the continuum flux, against the Doppler velocity in units of the terminal velocity of the wind, from -1.5 to 1.5. The continuum is a dashed horizontal line at 1. On the blue side, between -1 and 0, the flux drops below the continuum in a deep absorption trough, which ends sharply at -1. On the red side there is an emission peak, about 1.5 times the continuum, just above zero velocity, which decreases to the continuum at +1.</desc>
