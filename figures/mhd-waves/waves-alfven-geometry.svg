<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="alf-t alf-d">
<title id="alf-t">Geometry of the Alfvén wave</title>
<desc id="alf-d">Axes: x up, z to the right, y towards the lower left. The background field B0 lies along z. The wave vector k lies in the xz-plane at angle theta from z; the unit vector k-perp is perpendicular to k in the same plane. The displacement xi points along y, perpendicular to both k and B0.</desc>
<defs><marker id="ah-k" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="360" height="340" fill="#fff"/>
<g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif">
<line x1="150.0" y1="25.0" x2="150.0" y2="235.0" stroke="#000" stroke-width="1.5"/>
<line x1="105.0" y1="190.0" x2="320.0" y2="190.0" stroke="#000" stroke-width="1.5"/>
<line x1="150.0" y1="190.0" x2="92.5" y2="276.2" stroke="#000" stroke-width="1.5"/>
<text x="162" y="37" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">x</text>
<text x="324" y="212" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">z</text>
<text x="86.5" y="296.25" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">y</text>
<line x1="150.0" y1="190.0" x2="295.0" y2="190.0" stroke="#000" stroke-width="3.0" marker-end="url(#ah-k)"/>
<text x="255" y="168" text-anchor="start" font-size="22" font-style="normal" font-weight="bold" fill="#000">B<tspan dy="5.0" font-size="15.8" font-style="normal">0</tspan></text>
<line x1="150.0" y1="190.0" x2="217.2" y2="122.8" stroke="#000" stroke-width="3.0" marker-end="url(#ah-k)"/>
<text x="228" y="112" text-anchor="start" font-size="22" font-style="normal" font-weight="bold" fill="#000">k</text>
<line x1="150.0" y1="190.0" x2="82.8" y2="122.8" stroke="#000" stroke-width="3.0" marker-end="url(#ah-k)"/>
<text x="32" y="105" text-anchor="start" font-size="22" font-style="normal" font-weight="bold" fill="#000">k̂<tspan dy="5.0" font-size="15.8" font-style="normal">⊥</tspan></text>
<path d="M 138.0 178.0 L 150.0 166.0 L 162.0 178.0" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 188 190 A 38 38 0 0 0 177 163" fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" />
<text x="212" y="174" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">θ</text>
<line x1="150.0" y1="190.0" x2="102.0" y2="254.0" stroke="#000" stroke-width="3.0" marker-end="url(#ah-k)"/>
<text x="93.999885669387" y="259.9999142518807" text-anchor="end" font-size="24" font-style="normal" font-weight="bold" fill="#000">ξ</text>
</g>
