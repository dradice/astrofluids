<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="par-t par-d">
<title id="par-t">Polarizations of MHD waves propagating along the field</title>
<desc id="par-d">Two panels with axes x up, z right and y to the lower left; B0 and k both lie along z. Left, for v_A &gt; c_s: the fast mode is polarized along x, the slow mode along z and the Alfvén mode along y. Right, for v_A &lt; c_s the fast and slow modes exchange polarizations: the slow mode is along x and the fast mode along z. Below each panel are the corresponding frequencies.</desc>
