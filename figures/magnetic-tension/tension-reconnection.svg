<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="recon-t recon-d">
<title id="recon-t">Explosive reconnection between two plates</title>
<desc id="recon-d">Panel (a): two grey conducting plates, one above the other, a distance 2D apart. Two field lines B (blue) are anchored on the plates and bowed towards each other, with height l; black arrows labelled f show the external force that stretches them, and the horizontal extent of each arc is D. Panel (b): after reconnection the field lines are straight, running between the plates, and arrows labelled v show the plasma moving outwards.</desc>
