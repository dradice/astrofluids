<text x="240" y="62" text-anchor="middle" font-size="20" font-style="normal" font-weight="normal" fill="#000">prominence</text>
<text x="272" y="211" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">V</text>
<line x1="176.0" y1="198.0" x2="176.0" y2="250.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah-k)"/>
<text x="147" y="224" text-anchor="start" font-size="20" font-style="normal" font-weight="bold" fill="#000">g</text>
