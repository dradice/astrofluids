<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="pt-t pt-d">
<title id="pt-t">Magnetic pressure and magnetic tension forces</title>
<desc id="pt-d">Left panel: a bundle of field lines pointing out of the page (circled dots, with unit vector b-hat); four arrows pointing diagonally outward show the magnetic pressure force, minus the perpendicular gradient of B squared over 2 mu-zero. Right panel: a curved field line (blue) with direction b-hat; an arrow from the curve towards its centre of curvature shows the tension force B squared over mu-zero times (b-hat dot nabla) b-hat.</desc>
