<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-labelledby="atm-t atm-d">
<title id="atm-t">Plane-parallel magnetized atmosphere</title>
<desc id="atm-d">Axes y (horizontal) and z (vertical). Three horizontal green lines represent the magnetic field B(y, z), parallel to the y axis. Blue dots represent the gas, which is denser at the bottom than at the top. A blue arrow pointing down is labelled minus nabla Psi, the direction of gravity.</desc>
