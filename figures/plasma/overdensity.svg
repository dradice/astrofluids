<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
<title>Over-density of electrons</title>
<desc>A grey disc of radius L in which the electron density is increased by delta n, embedded in a medium of density n.</desc>
<rect width="420" height="300" fill="#fff"/>
<circle cx="210" cy="150" r="125" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<path d="M210 150 L298 62" stroke="#000" stroke-width="1.5"/>
<g font-family="serif" font-size="20" font-style="italic" fill="#000">
<text x="190" y="90">δn</text>
<text x="262" y="125">L</text>
<text x="165" y="235">n</text>
</g>
</svg>
