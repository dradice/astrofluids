<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-labelledby="title desc">
<title id="title">Lorentz force on an electron in an electromagnetic wave</title>
<desc id="desc">An electromagnetic wave travels to the right along the x axis, in the direction of the Poynting vector S. The electric field E oscillates in the vertical plane and the magnetic field B, in phase with it, in the perpendicular horizontal plane. On the right, an electron sits in a plane perpendicular to the direction of propagation, where E points up: the electric force accelerates the electron downwards, giving it a velocity v, and the magnetic force F, proportional to v cross B, points to the right, along the direction of propagation.</desc>
