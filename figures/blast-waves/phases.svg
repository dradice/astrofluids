<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="phases-t phases-d">
<title id="phases-t">Shock velocity in the three phases of a supernova remnant</title>
<desc id="phases-d">Sketch of the shock velocity U_sh against time t, both on logarithmic axes. In the free-expansion phase, up to t_0, U_sh is constant. In the Sedov–Taylor phase, between t_0 and t_1, it decreases as t to the power -3/5. At t_1 it drops, and in the snowplough phase it decreases as t to the power -5/7.</desc>
<defs><marker id="ah-k" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="560" height="300" fill="#fff"/>
<g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif">
<line x1="70.0" y1="230.0" x2="70.0" y2="20.0" stroke="#000" stroke-width="1.6" marker-end="url(#ah-k)"/>
<line x1="70.0" y1="230.0" x2="540.0" y2="230.0" stroke="#000" stroke-width="1.6" marker-end="url(#ah-k)"/>
<text x="60" y="32" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">U<tspan dy="5.0" font-size="14.4" font-style="normal">sh</tspan></text>
<text x="530" y="270" text-anchor="end" font-size="20" font-style="italic" font-weight="normal" fill="#000">t</text>
<path d="M 85.0 55.0 L 200.0 55.0 L 370.0 111.1" fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 370.0 111.1 L 370.0 129.1 L 510.0 184.1" fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
<line x1="200.0" y1="230.0" x2="200.0" y2="236.0" stroke="#000" stroke-width="1.6"/>
<text x="200" y="258" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">t<tspan dy="5.0" font-size="14.4" font-style="normal">0</tspan></text>
<line x1="200.0" y1="230.0" x2="200.0" y2="40.0" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="370.0" y1="230.0" x2="370.0" y2="236.0" stroke="#000" stroke-width="1.6"/>
<text x="370" y="258" text-anchor="middle" font-size="20" font-style="italic" font-weight="normal" fill="#000">t<tspan dy="5.0" font-size="14.4" font-style="normal">1</tspan></text>
<line x1="370.0" y1="230.0" x2="370.0" y2="40.0" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>
<text x="295.0" y="71.05" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">t<tspan dy="-8.0" font-size="14.4" font-style="normal">−3/5</tspan></text>
<text x="450.0" y="144.6" text-anchor="start" font-size="20" font-style="italic" font-weight="normal" fill="#000">t<tspan dy="-8.0" font-size="14.4" font-style="normal">−5/7</tspan></text>
<text x="135.0" y="196" text-anchor="middle" font-size="17" font-style="normal" font-weight="normal" fill="#000">free</text>
<text x="135.0" y="216" text-anchor="middle" font-size="17" font-style="normal" font-weight="normal" fill="#000">expansion</text>
<text x="285.0" y="196" text-anchor="middle" font-size="17" font-style="normal" font-weight="normal" fill="#000">Sedov–Taylor</text>
<text x="440.0" y="196" text-anchor="middle" font-size="17" font-style="normal" font-weight="normal" fill="#000">snowplough</text>
</g>
</svg>
