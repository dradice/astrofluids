<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="vec-stokes-t vec-stokes-d">
<title id="vec-stokes-t">Stokes' theorem</title>
<desc id="vec-stokes-d">A curved surface S, shaded grey, shaped like a dome, whose edge is the closed curve C, drawn as an ellipse. Arrows along C show the direction of the line element dl, counterclockwise when seen from above. At the top of the dome a small patch of the surface carries the area element dA, an arrow pointing up and away from the surface. The direction of C and that of dA are related by the right-hand rule: with the thumb along dA, the fingers curl along C.</desc>
