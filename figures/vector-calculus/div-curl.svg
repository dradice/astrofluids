<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="vec-div-curl-t vec-div-curl-d">
<title id="vec-div-curl-t">Divergence of a curl</title>
<desc id="vec-div-curl-d">A closed surface cut along a closed curve C into two pieces, drawn pulled apart. The upper piece S_1 is a dome whose rim is C; its area element dA points up, out of the enclosed volume, and the arrow on its rim shows that C is traversed counterclockwise when seen from above. The lower piece S_2 is a bowl with the same rim C; its area element dA points down, again out of the volume, and the arrow on its rim shows that C is traversed clockwise when seen from above, opposite to the upper piece. The two circulations along C therefore cancel.</desc>
