<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 410" width="460" height="410"
     role="img" aria-labelledby="title desc">
  <title id="title">Mechanical analogue of the magnetorotational instability</title>
  <desc id="desc">A central object on the left and a dashed circular orbit of radius R
  around it. On the orbit, two masses m are joined by a spring that passes through their
  common centre of mass. Local axes at the centre of mass: x points radially outward and
  y along the orbit.</desc>
  <!-- Redrawn from the 2025 TeXmacs worksheet figure (28-mri). Drawn at the size at
       which labels match the body text (about 19 px). Edit by hand or in Inkscape. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="460" height="410" fill="#fff"/>

  <!-- orbit of radius R around the central object at (40, 225) -->
  <path d="M 199.9 20 A 260 260 0 0 1 236.7 395" fill="none" stroke="#000" stroke-width="1.6"
        stroke-dasharray="10 7"/>
  <!-- central object -->
  <circle cx="40" cy="225" r="20" fill="#d9d9d9" stroke="#000" stroke-width="1.6"/>
  <!-- radius -->
  <line x1="60" y1="225" x2="296" y2="225" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- spring with two masses, through the centre of mass at (300, 225) -->
  <g transform="translate(300 225) rotate(-36.25)">
    <polyline fill="none" stroke="#444" stroke-width="2"
      points="-130,0 -112,0 -107,-8 -97,8 -87,-8 -77,8 -67,-8 -57,8 -47,-8 -37,8 -27,-8 -17,8
              -7,-8 3,8 13,-8 23,8 33,-8 43,8 53,-8 63,8 73,-8 83,8 93,-8 103,8 108,0 130,0"/>
    <circle cx="-130" cy="0" r="9" fill="#1f4fbf"/>
    <circle cx="130" cy="0" r="9" fill="#1f4fbf"/>
  </g>

  <!-- local axes at the centre of mass -->
  <line x1="300" y1="225" x2="300" y2="128" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="300" y1="225" x2="402" y2="225" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif" font-size="20"
     font-style="italic" fill="#000">
    <text x="165" y="215">R</text>
    <text x="309" y="145">y</text>
    <text x="388" y="250">x</text>
    <text x="176" y="337">m</text>
    <text x="414" y="132">m</text>
  </g>
</svg>
