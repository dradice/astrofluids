project:
  type: book
  output-dir: _book

book:
  title: "Astrophysical Fluid Dynamics"
  subtitle: "Lecture notes for ASTRO 442"
  author: "David Radice"
  site-url: https://dradice.github.io/astrofluids/
  repo-url: https://github.com/dradice/astrofluids
  search: true
  page-footer:
    center: >-
      © David Radice ·
      [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)
  # The chapter list is generated by `python3 tools/chapters.py yaml`.
  # Edit tools/chapters.py, not this block, then paste the output here.
  chapters:
    - index.qmd
    - schedule.qmd
    - part: "Foundations"
      chapters:
        - chapters/fluids-as-continua.qmd
        - chapters/thermodynamics.qmd
        - chapters/supernovae.qmd
        - chapters/euler-equation.qmd
        - chapters/eulerian-lagrangian.qmd
        - chapters/conservation-laws.qmd
        - chapters/gravitational-potential.qmd
        - chapters/hydrostatic-equilibrium.qmd
    - part: "Waves, Shocks, and Outflows"
      chapters:
        - chapters/sound-waves.qmd
        - chapters/stratified-atmospheres.qmd
        - chapters/shock-waves.qmd
        - chapters/radiative-shocks.qmd
        - chapters/blast-waves.qmd
        - chapters/winds-and-accretion.qmd
    - part: "Instabilities, Viscosity, Disks, and Turbulence"
      chapters:
        - chapters/instabilities-convection.qmd
        - chapters/instabilities-rt-kh.qmd
        - chapters/instabilities-thermal-gravitational.qmd
        - chapters/viscous-flows.qmd
        - chapters/accretion-disks-structure.qmd
        - chapters/accretion-disks-spectra.qmd
        - chapters/turbulence.qmd
    - part: "Plasma and Magnetohydrodynamics"
      chapters:
        - chapters/plasma.qmd
        - chapters/mhd-equations.qmd
        - chapters/flux-freezing.qmd
        - chapters/magnetic-tension.qmd
        - chapters/mhd-waves.qmd
        - chapters/mri.qmd
  appendices:
    - appendices/vector-calculus.qmd

lang: en
bibliography: references.bib

# Format-aware math macros (\vb, \dd, \ii, \ee). See filters/macros.lua.
filters:
  - filters/macros.lua

crossref:
  # TeXmacs "axiom" blocks become Assumptions. Quarto's custom crossref
  # types must be floats, so we rename the unused built-in "conjecture".
  cnj-title: "Assumption"
  cnj-prefix: "Assumption"

format:
  html:
    html-math-method: mathjax
    include-in-header: styles/mathjax.html
    theme:
      light: [cosmo, styles/custom.scss]
      dark: [darkly, styles/custom.scss]
    toc: true
    toc-depth: 2
    axe: true
  typst:
    papersize: us-letter
    toc: true
